# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
cargo_metadata = "0.14.1"
clap = { version = "4.5.49", features = ["derive"] }
walkdir = "2.5.0"
xml-builder = "0.5.4"
